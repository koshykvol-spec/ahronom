<div id="cart-float" onclick="openCart()">🛒 Кошик (<span id="cart-count">0</span>)</div>

<script src="cart.js"></script>
<script src="app.js"></script>
<!-- Модальне вікно: збільшене фото + анотація -->
<div id="photo-modal" onclick="closePhotoModal()" style="display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.75); z-index:9998; align-items:center; justify-content:center; padding:16px;">
  <div onclick="event.stopPropagation()" style="background:#fff; border-radius:16px; max-width:420px;
    width:100%; overflow:hidden; position:relative; box-shadow:0 8px 32px rgba(0,0,0,0.3);">
    <button onclick="closePhotoModal()" style="position:absolute; top:10px; right:12px; background:rgba(0,0,0,0.4);
      color:#fff; border:none; border-radius:50%; width:28px; height:28px; font-size:1.1rem; cursor:pointer;">✕</button>
    <img id="modal-img" src="" alt="" style="width:100%; max-height:320px; object-fit:contain; background:#f4f4f4; padding:12px; box-sizing:border-box;">
    <div style="padding:16px 20px 20px;">
      <h3 id="modal-name" style="margin:0 0 8px; font-size:1rem; color:#1a2e1a;"></h3>
      <p id="modal-annot" style="margin:0 0 12px; font-size:.9rem; color:#555; line-height:1.5;"></p>
      <p id="modal-price" style="margin:0; font-size:1.2rem; font-weight:bold; color:#27ae60;"></p>
    </div>
  </div>
</div>
